services:
  backend:
    build:
      context: ./backend
    environment:
      SUPERSTAFF_DB_PATH: /app/data/superstaff.db
    volumes:
      - superstaff_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"
      interval: 10s
      timeout: 3s
      retries: 6

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  superstaff_data:
